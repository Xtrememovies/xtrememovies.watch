<script>
const API_KEY = "925111c270baf9b011e32b3c70c84546";

const $ = id => document.getElementById(id);
const grid = $("movieGrid");
const message = $("message");
const heading = $("sectionHeading");
const searchInput = $("searchInput");
const filterPanel = $("filterPanel");
const genreChipGrid = $("genreChipGrid");
const playerModal = $("playerModal");
const nativePlayer = $("nativePlayer");
const modalTitle = $("modalTitle");
const modalOverview = $("modalOverview");
const videoContainer = document.querySelector(".video-container");
const authModal = $("authModal");
const authForm = $("authForm");
const authEmail = $("authEmail");
const authPassword = $("authPassword");
const authStatus = $("authStatus");

let currentMode = "movie";
let activeVJ = "";
let selectedGenre = "";
let currentRequest = 0;
let watchlist = [];

try {
  const saved = JSON.parse(localStorage.getItem("xtreme_watchlist") || "[]");
  if (Array.isArray(saved)) watchlist = saved;
} catch {
  watchlist = [];
}

const movieGenres = [
  [28, "Action"], [12, "Adventure"], [16, "Animation"],
  [35, "Comedy"], [80, "Crime"], [99, "Documentary"],
  [18, "Drama"], [10751, "Family"], [14, "Fantasy"],
  [27, "Horror"], [9648, "Mystery"], [10749, "Romance"],
  [878, "Sci-Fi"], [53, "Thriller"], [10752, "War"]
];

const tvGenres = [
  [10759, "Action & Adventure"], [16, "Animation"],
  [35, "Comedy"], [80, "Crime"], [99, "Documentary"],
  [18, "Drama"], [10751, "Family"], [10762, "Kids"],
  [9648, "Mystery"], [10765, "Sci-Fi & Fantasy"],
  [10768, "War & Politics"], [37, "Western"]
];

function updateWatchlistBadge() {
  $("watchlistCount").textContent = watchlist.length;
}

function saveWatchlist() {
  try {
    localStorage.setItem("xtreme_watchlist", JSON.stringify(watchlist));
  } catch (error) {
    console.error("Could not save watchlist:", error);
  }
  updateWatchlistBadge();
}

function setMessage(text) {
  message.textContent = text;
  message.classList.remove("hidden");
}

function setActiveNav(name) {
  ["navHome", "navMovies", "navSeries"].forEach(id => {
    $(id).classList.toggle("active", id === name);
  });

  document.querySelectorAll(".bottom-nav [data-nav]").forEach(button => {
    button.classList.toggle("active", button.dataset.nav === name);
  });
}

function showGenreTab() {
  document.querySelectorAll(".filter-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.target === "genreContent");
  });
  document.querySelectorAll(".filter-content").forEach(content => {
    content.classList.toggle("active", content.id === "genreContent");
  });
}

function populateGenres(mode) {
  genreChipGrid.replaceChildren();
  const genres = mode === "tv" ? tvGenres : movieGenres;

  const allChip = document.createElement("div");
  allChip.className = "chip" + (!selectedGenre ? " active" : "");
  allChip.textContent = "All";
  allChip.dataset.genre = "";
  genreChipGrid.appendChild(allChip);

  genres.forEach(([id, name]) => {
    const chip = document.createElement("div");
    chip.className = "chip" + (String(selectedGenre) === String(id) ? " active" : "");
    chip.dataset.genre = String(id);
    chip.textContent = name;
    genreChipGrid.appendChild(chip);
  });
}

async function tmdb(path, params = {}) {
  const url = new URL("https://api.themoviedb.org/3/" + path);
  url.searchParams.set("api_key", API_KEY);
  url.searchParams.set("language", "en-US");

  Object.entries(params).forEach(([key, value]) => {
    if (value !== "" && value !== null && value !== undefined) {
      url.searchParams.set(key, value);
    }
  });

  const response = await fetch(url);
  if (!response.ok) {
    throw new Error("Movie catalogue request failed (" + response.status + ")");
  }
  return response.json();
}

async function loadMedia(query = "", mode = "movie", genreId = "", type = "") {
  currentMode = mode;
  const requestId = ++currentRequest;

  grid.replaceChildren();
  setMessage("Loading movies and posters...");
  populateGenres(mode);

  try {
    let path;
    const params = { page: 1 };

    if (query) {
      path = "search/" + (mode === "tv" ? "tv" : "movie");
      params.query = query;
      params.include_adult = false;
    } else if (genreId) {
      path = "discover/" + (mode === "tv" ? "tv" : "movie");
      params.with_genres = genreId;
      params.sort_by = mode === "tv" ? "popularity.desc" : "popularity.desc";
    } else if (type === "latest") {
      path = "discover/movie";
      params.sort_by = "primary_release_date.desc";
      params["primary_release_date.lte"] = new Date().toISOString().slice(0, 10);
      params.vote_count_gte = 1;
    } else {
      path = mode === "tv" ? "tv/popular" : "movie/popular";
    }

    const data = await tmdb(path, params);
    if (requestId !== currentRequest) return;

    const results = data.results || [];
    if (!results.length) {
      setMessage("No results found. Try another search or genre.");
      return;
    }

    message.classList.add("hidden");
    results.forEach(item => renderCard(item, mode));
  } catch (error) {
    if (requestId !== currentRequest) return;
    console.error(error);
    setMessage("Could not load the catalogue. Check your internet connection and TMDB API key, then try again.");
  }
}

function renderCard(item, mode = currentMode) {
  const titleText = item.title || item.name || "Untitled";
  const dateText = item.release_date || item.first_air_date || "";
  const card = document.createElement("article");
  card.className = "movie";

  const posterContainer = document.createElement("div");
  posterContainer.className = "poster-container";

  if (item.poster_path) {
    const poster = document.createElement("img");
    poster.alt = titleText + " poster";
    poster.loading = "lazy";
    poster.src = "https://image.tmdb.org/t/p/w500" + item.poster_path;
    poster.onerror = () => {
      poster.remove();
      const fallback = document.createElement("div");
      fallback.className = "poster-fallback";
      fallback.textContent = titleText;
      posterContainer.appendChild(fallback);
    };
    posterContainer.appendChild(poster);
  } else {
    const fallback = document.createElement("div");
    fallback.className = "poster-fallback";
    fallback.textContent = titleText;
    posterContainer.appendChild(fallback);
  }

  const info = document.createElement("div");
  info.className = "movie-info";

  const title = document.createElement("h3");
  title.textContent = titleText;

  const year = document.createElement("p");
  year.textContent =
    (dateText ? dateText.slice(0, 4) : "Year unknown") +
    " · ★ " + Number(item.vote_average || 0).toFixed(1);

  const actions = document.createElement("div");
  actions.className = "card-actions";

  const playBtn = document.createElement("button");
  playBtn.type = "button";
  playBtn.className = "play-btn";
  playBtn.textContent = "▶ Trailer";
  playBtn.addEventListener("click", () => openTrailer(item, mode));

  const saved = watchlist.some(w =>
    String(w.id) === String(item.id) &&
    (w._mediaType || "movie") === mode
  );

  const listBtn = document.createElement("button");
  listBtn.type = "button";
  listBtn.textContent = saved ? "✓ In List" : "+ List";
  if (saved) listBtn.style.background = "var(--netflix-red)";

  listBtn.addEventListener("click", () => {
    const index = watchlist.findIndex(w =>
      String(w.id) === String(item.id) &&
      (w._mediaType || "movie") === mode
    );

    if (index >= 0) {
      watchlist.splice(index, 1);
    } else {
      watchlist.push({ ...item, _mediaType: mode });
    }

    saveWatchlist();
    showWatchlist();
  });

  actions.append(playBtn, listBtn);
  info.append(title, year, actions);
  card.append(posterContainer, info);
  grid.appendChild(card);
}

function openPlayerShell(title, overview) {
  modalTitle.textContent = title || "Movie Trailer";
  modalOverview.textContent = overview || "No description available.";
  nativePlayer.pause();
  nativePlayer.removeAttribute("src");
  nativePlayer.load();

  const oldFrame = videoContainer.querySelector("iframe");
  if (oldFrame) oldFrame.remove();

  const oldNotice = videoContainer.querySelector(".trailer-notice");
  if (oldNotice) oldNotice.remove();

  nativePlayer.classList.remove("hidden");
  playerModal.classList.remove("hidden");
}

async function openTrailer(item, mode) {
  const title = item.title || item.name || "Movie Trailer";
  openPlayerShell(title, item.overview);

  const notice = document.createElement("p");
  notice.className = "trailer-notice";
  notice.style.cssText =
    "position:absolute;inset:0;display:flex;align-items:center;" +
    "justify-content:center;text-align:center;padding:24px;color:white;" +
    "background:#080808;margin:0;";
  notice.textContent = "Looking for an available trailer...";
  videoContainer.appendChild(notice);
  nativePlayer.classList.add("hidden");

  try {
    const category = mode === "tv" ? "tv" : "movie";
    const data = await tmdb(category + "/" + item.id + "/videos");
    if (playerModal.classList.contains("hidden")) return;

    const videos = data.results || [];
    const trailer = videos.find(v =>
      v.site === "YouTube" && v.type === "Trailer" && v.key
    ) || videos.find(v =>
      v.site === "YouTube" && v.type === "Teaser" && v.key
    ) || videos.find(v => v.site === "YouTube" && v.key);

    notice.remove();

    if (!trailer) {
      const noTrailer = document.createElement("p");
      noTrailer.className = "trailer-notice";
      noTrailer.style.cssText =
        "position:absolute;inset:0;display:flex;align-items:center;" +
        "justify-content:center;text-align:center;padding:24px;color:white;" +
        "background:#080808;margin:0;";
      noTrailer.textContent = "Trailer unavailable for this title. Please try another movie or series.";
      videoContainer.appendChild(noTrailer);
      return;
    }

    const frame = document.createElement("iframe");
    frame.title = title + " trailer";
    frame.src = "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(trailer.key) + "?autoplay=1&rel=0";
    frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    frame.allowFullscreen = true;
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    frame.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0;";
    videoContainer.appendChild(frame);
  } catch (error) {
    console.error(error);
    notice.textContent = "Could not load the trailer. Check your connection and try again.";
  }
}

function closePlayerModal() {
  nativePlayer.pause();
  nativePlayer.removeAttribute("src");
  nativePlayer.load();
  videoContainer.querySelectorAll("iframe, .trailer-notice").forEach(el => el.remove());
  nativePlayer.classList.remove("hidden");
  playerModal.classList.add("hidden");
}

$("closeModal").addEventListener("click", closePlayerModal);
playerModal.addEventListener("click", e => {
  if (e.target === playerModal) closePlayerModal();
});

function showWatchlist() {
  currentRequest++;
  heading.textContent = "My Watchlist";
  grid.replaceChildren();

  if (!watchlist.length) {
    setMessage("Your watchlist is empty. Tap + List on any movie or series to save it.");
    return;
  }

  message.classList.add("hidden");
  watchlist.forEach(item => renderCard(item, item._mediaType || "movie"));
}

function resetFilters() {
  activeVJ = "";
  selectedGenre = "";
  searchInput.value = "";
  document.querySelectorAll("#vjChipGrid .chip").forEach(chip => {
    chip.classList.remove("active");
  });
  populateGenres(currentMode);
}

function showMovies() {
  resetFilters();
  currentMode = "movie";
  heading.textContent = "Popular Movies";
  setActiveNav("navMovies");
  loadMedia("", "movie");
}

function showSeries() {
  resetFilters();
  currentMode = "tv";
  heading.textContent = "Popular TV Series";
  setActiveNav("navSeries");
  loadMedia("", "tv");
}

function showHome() {
  resetFilters();
  currentMode = "movie";
  heading.textContent = "Latest Movie Releases";
  setActiveNav("navHome");
  loadMedia("", "movie", "", "latest");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("navHome").addEventListener("click", e => {
  e.preventDefault();
  showHome();
});

$("brandLogo").addEventListener("click", e => {
  e.preventDefault();
  showHome();
});

$("navMovies").addEventListener("click", e => {
  e.preventDefault();
  showMovies();
});

$("navSeries").addEventListener("click", e => {
  e.preventDefault();
  showSeries();
});

function openFilter() {
  filterPanel.style.display = "block";
  showGenreTab();
  populateGenres(currentMode);
  filterPanel.scrollIntoView({ behavior: "smooth", block: "start" });
}

$("navFilterTab").addEventListener("click", e => {
  e.preventDefault();
  openFilter();
});

document.querySelectorAll(".filter-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".filter-tab").forEach(t =>
      t.classList.toggle("active", t === tab)
    );
    document.querySelectorAll(".filter-content").forEach(content =>
      content.classList.toggle("active", content.id === tab.dataset.target)
    );
  });
});

genreChipGrid.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;

  selectedGenre = chip.dataset.genre || "";
  activeVJ = "";
  searchInput.value = "";
  populateGenres(currentMode);

  heading.textContent = selectedGenre
    ? chip.textContent + (currentMode === "tv" ? " Series" : " Movies")
    : (currentMode === "tv" ? "Popular TV Series" : "Popular Movies");

  loadMedia("", currentMode, selectedGenre);
});

$("vjChipGrid").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;

  document.querySelectorAll("#vjChipGrid .chip").forEach(c =>
    c.classList.toggle("active", c === chip)
  );

  activeVJ = chip.dataset.vj || "";
  heading.textContent = activeVJ + " Translation Archive";
  grid.replaceChildren();
  setMessage(
    "TMDB does not identify Lugandan VJ translations. This catalogue filter needs a translation-specific movie source; ordinary TMDB results cannot confirm which VJ translated a title."
  );
});

$("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const query = searchInput.value.trim();
  if (!query) return;

  activeVJ = "";
  selectedGenre = "";
  heading.textContent = 'Search Results for "' + query + '"';
  loadMedia(query, currentMode);
});

$("navWatchlist").addEventListener("click", e => {
  e.preventDefault();
  document.querySelectorAll(".bottom-nav button").forEach(b =>
    b.classList.remove("active")
  );
  showWatchlist();
});

document.querySelectorAll(".bottom-nav [data-nav]").forEach(button => {
  button.addEventListener("click", () => {
    const destination = button.dataset.nav;

    if (destination === "home") showHome();
    if (destination === "movies") showMovies();
    if (destination === "series") showSeries();
    if (destination === "filter") openFilter();

    if (destination === "signin") {
      authStatus.textContent = "";
      authModal.classList.remove("hidden");
    }
  });
});

function openAuth() {
  authStatus.textContent = "";
  authModal.classList.remove("hidden");
}

$("navSignIn").addEventListener("click", e => {
  e.preventDefault();
  openAuth();
});

$("closeAuthModal").addEventListener("click", () => {
  authModal.classList.add("hidden");
});

authModal.addEventListener("click", e => {
  if (e.target === authModal) authModal.classList.add("hidden");
});

authForm.addEventListener("submit", async e => {
  e.preventDefault();
  authStatus.style.color = "#ffb3b3";
  authStatus.textContent = "Checking your sign-in...";

  try {
    if (typeof _supabase === "undefined") {
      throw new Error("Supabase could not initialize. Check its script and project settings.");
    }

    const { error } = await _supabase.auth.signInWithPassword({
      email: authEmail.value.trim(),
      password: authPassword.value
    });

    if (error) throw error;

    authStatus.style.color = "#46d369";
    authStatus.textContent = "Successfully signed in!";
    setTimeout(() => authModal.classList.add("hidden"), 1200);
  } catch (error) {
    console.error("Sign-in error:", error);
    authStatus.style.color = "#ff7777";
    authStatus.textContent = error.message || "Sign-in failed. Check your email and password.";
  }
});

const contactModal = $("contactModal");

["contactLink", "footerContactLink"].forEach(id => {
  $(id).addEventListener("click", e => {
    e.preventDefault();
    contactModal.classList.remove("hidden");
  });
});

$("closeContactModal").addEventListener("click", () => {
  contactModal.classList.add("hidden");
});

contactModal.addEventListener("click", e => {
  if (e.target === contactModal) contactModal.classList.add("hidden");
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closePlayerModal();
    authModal.classList.add("hidden");
    contactModal.classList.add("hidden");
  }
});

updateWatchlistBadge();
populateGenres("movie");
showHome();
</script>

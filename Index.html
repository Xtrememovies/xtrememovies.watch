
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extreme Movie Watch</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101018;
      color: white;
    }

    header {
      background: #e50914;
      text-align: center;
      padding: 20px;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 16px;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
    }

    button {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      margin: 5px;
      border-radius: 6px;
      font-size: 15px;
    }

    .note {
      color: #ccc;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Extreme Movie Watch</h1>
    <p>Extreme Watch</p>
  </header>

  <main>
    <h2>Watch Movie Trailers</h2>
    <p>Choose a video to play it inside your website.</p>

    <iframe
      id="player"
      class="player"
      src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ"
      title="Video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>

    <h3 id="videoTitle">Test Video</h3>

    <button onclick="playVideo('aqz-KE-bpKQ','Test Video')">
      Play Test Video
    </button>

    <button onclick="playVideo('M7lc1UVf-VE','YouTube Demo')">
      Play Second Demo
    </button>

    <p class="note">
      These are demonstration videos, not movie trailers.
      We can add real trailers next.
    </p>
  </main>

  <script>
    function playVideo(id, title) {
      document.getElementById("player").src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id);

      document.getElementById("videoTitle").textContent = title;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extreme Movie Watch</title>
  <style>
    :root {
      --bg-color: #101018;
      --surface-color: #1a1a26;
      --primary-red: #e50914;
      --primary-hover: #f40612;
      --text-main: #ffffff;
      --text-muted: #a7a7b3;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
    }

    header {
      background: var(--surface-color);
      border-bottom: 1px solid #2a2a3d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      margin: 0;
      color: var(--primary-red);
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    main {
      width: 100%;
      max-width: 1400px;
      margin: 16px auto;
      padding: 0 20px;
    }

    /* Video Player Section fitted to viewport height */
    .player-container {
      background: var(--surface-color);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2a2a3d;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    .player {
      width: 100%;
      height: 52vh;
      min-height: 250px;
      max-height: 550px;
      border: 0;
      display: block;
    }

    .player-info {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .player-info h3 {
      margin: 0;
      font-size: 18px;
    }

    .player-info p {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Controls Bar (Filters & Title) */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 17px;
      margin: 0;
      font-weight: 600;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .filter-btn {
      background: var(--surface-color);
      color: var(--text-muted);
      border: 1px solid #2a2a3d;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--primary-red);
      color: white;
      border-color: var(--primary-red);
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .movie-card {
      background: var(--surface-color);
      border: 1px solid #2a2a3d;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .movie-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary-red);
    }

    .movie-card.active-card {
      border-color: var(--primary-red);
      box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.25);
    }

    .movie-card h4 {
      margin: 0 0 4px;
      font-size: 15px;
    }

    .movie-card .meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .movie-card button {
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .movie-card button:hover {
      background: var(--primary-hover);
    }

    .note {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 4px;
        padding: 10px;
      }
      .player {
        height: 35vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Extreme Movie Watch</h1>
    <p>Extreme Watch</p>
  </header>

  <main>
    <!-- Video Player Box -->
    <div class="player-container">
      <iframe
        id="player"
        class="player"
        src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ"
        title="Video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
      <div class="player-info">
        <h3 id="videoTitle">Test Video</h3>
        <p id="videoDesc">Select a video title below to play it inside your website.</p>
      </div>
    </div>

    <!-- Controls Bar & Filters -->
    <div class="controls-bar">
      <h2 class="section-title">Available Watch List</h2>
      <div class="filters">
        <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="filter-btn" onclick="filterCategory('vj', this)">Luganda VJ</button>
        <button class="filter-btn" onclick="filterCategory('action', this)">Action</button>
        <button class="filter-btn" onclick="filterCategory('demo', this)">Demos</button>
      </div>
    </div>

    <!-- Movie Selection Grid -->
    <div class="movie-grid" id="movieGrid">
      <div class="movie-card" data-category="demo">
        <div>
          <h4>Test Video</h4>
          <div class="meta">Demo · 2026</div>
        </div>
        <button onclick="playVideo('aqz-KE-bpKQ', 'Test Video', 'Standard platform test video feed.', this)">Play Video</button>
      </div>

      <div class="movie-card" data-category="demo">
        <div>
          <h4>YouTube Demo</h4>
          <div class="meta">Demo · 2026</div>
        </div>
        <button onclick="playVideo('M7lc1UVf-VE', 'YouTube Demo', 'Secondary system test playback stream.', this)">Play Video</button>
      </div>
    </div>

    <p class="note">
      Easily add more movies to your grid by duplicating the card blocks above and updating the video IDs and categories.
    </p>
  </main>

  <script>
    function playVideo(id, title, desc, btnElement) {
      document.getElementById("player").src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id) + "?autoplay=1";

      document.getElementById("videoTitle").textContent = title;
      document.getElementById("videoDesc").textContent = desc;

      document.querySelectorAll('.movie-card').forEach(card => card.classList.remove('active-card'));
      if (btnElement) {
        btnElement.closest('.movie-card').classList.add('active-card');
      }
    }

    function filterCategory(category, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const cards = document.querySelectorAll('.movie-card');
      cards.forEach(card => {
        if (category === 'all' || card.getAttribute('data-category') === category) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
